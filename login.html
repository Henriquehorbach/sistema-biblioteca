<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Biblioteca Inteligente</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-gradient-to-br from-blue-50 via-indigo-50 to-purple-100 min-h-screen font-sans flex items-center justify-center p-4 relative">

    <div class="bg-white/80 backdrop-blur-xl rounded-[2.5rem] shadow-[0_8px_30px_rgb(0,0,0,0.04)] border border-white/60 w-full max-w-4xl flex flex-col md:flex-row overflow-hidden">

        <div class="w-full md:w-1/2 bg-gradient-to-br from-indigo-500 to-violet-600 p-12 text-white flex flex-col justify-center items-center relative overflow-hidden hidden md:flex">
            
            <div class="absolute top-0 left-0 w-full h-full bg-white/10 backdrop-blur-3xl transform -skew-x-12 translate-x-20 pointer-events-none"></div>

            <div class="relative z-10 flex flex-col items-center text-center">
                
                <img src="Imagem/Logo app.png" alt="Logo Biblioteca" class="w-[320px] mb-8 rounded-[2rem] shadow-2xl border-4 border-white/40 bg-white block transform transition-transform hover:scale-105 object-contain">
                
                <h2 class="text-3xl font-extrabold mb-4 tracking-tight drop-shadow-sm">Bem-vindo de volta!</h2>
                <p class="text-indigo-100 font-medium text-sm leading-relaxed px-4">Acesse o painel de controle para gerenciar o acervo, leitores e realizar empréstimos de forma inteligente.</p>
            </div>
        </div>

        <div class="w-full md:w-1/2 p-10 md:p-14 flex flex-col justify-center relative">
            
            <div class="md:hidden flex justify-center mb-8">
                <img src="Imagem/Logo app.png" alt="Logo Biblioteca" class="w-[240px] rounded-3xl shadow-lg border-2 border-slate-100 bg-white block object-contain">
            </div>

            <div class="mb-8">
                <h3 class="text-3xl font-extrabold bg-clip-text text-transparent bg-gradient-to-r from-indigo-900 to-slate-800 tracking-tight">Acesse sua conta</h3>
                <p class="text-slate-500 text-sm mt-2 font-medium">Insira suas credenciais para acessar o painel.</p>
            </div>

            <form class="space-y-6">
                
                <div>
                    <label for="login_usuario" class="block text-sm font-bold text-slate-700 mb-1">Usuário</label>
                    <div class="relative">
                        <div class="absolute z-10 inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-5 h-5 text-indigo-400"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0zM4.501 20.118a7.5 7.5 0 0114.998 0A17.933 17.933 0 0112 21.75c-2.676 0-5.216-.584-7.499-1.632z" /></svg>
                        </div>
                        <input type="text" id="login_usuario" placeholder="Digite seu usuário" class="w-full pl-11 pr-4 py-3.5 border border-slate-200 rounded-xl text-slate-700 focus:outline-none focus:ring-2 focus:ring-indigo-500 transition-all bg-white/70 backdrop-blur-sm shadow-sm font-medium">
                    </div>
                </div>

                <div>
                    <label for="senha_acesso" class="block text-sm font-bold text-slate-700 mb-1">Senha</label>
                    <div class="relative">
                        <div class="absolute z-10 inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-5 h-5 text-indigo-400"><path stroke-linecap="round" stroke-linejoin="round" d="M16.5 10.5V6.75a4.5 4.5 0 10-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 002.25-2.25v-6.75a2.25 2.25 0 00-2.25-2.25H6.75a2.25 2.25 0 00-2.25 2.25v6.75a2.25 2.25 0 002.25 2.25z" /></svg>
                        </div>
                        <input type="password" id="senha_acesso" placeholder="••••••••" class="w-full pl-11 pr-12 py-3.5 border border-slate-200 rounded-xl text-slate-700 focus:outline-none focus:ring-2 focus:ring-indigo-500 transition-all bg-white/70 backdrop-blur-sm shadow-sm font-medium">
                        
                        <button type="button" id="toggle_senha" class="absolute z-10 inset-y-0 right-0 pr-4 flex items-center text-slate-400 hover:text-indigo-600 transition-colors">
                            <svg id="icone_olho" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-5 h-5">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 0 1 0-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178Z" />
                                <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" />
                            </svg>
                        </button>
                    </div>
                </div>

                <div class="flex items-center justify-between mt-4">
                    <div class="flex items-center">
                        <input type="checkbox" id="lembrar" class="h-4 w-4 text-indigo-600 focus:ring-indigo-500 border-slate-300 rounded cursor-pointer">
                        <label for="lembrar" class="ml-2 block text-sm text-slate-600 font-bold cursor-pointer">Lembrar de mim</label>
                    </div>
                    <div class="text-sm">
                        <a href="#" id="link_esqueci_senha" class="font-bold text-indigo-600 hover:text-indigo-500 transition-colors">Esqueci a senha</a>
                    </div>
                </div>

                <div id="mensagem_alerta" class="hidden"></div>

                <div class="pt-4">
                    <button type="button" id="botao_login" class="w-full flex justify-center items-center py-3.5 px-4 border border-transparent rounded-xl shadow-lg shadow-indigo-500/30 text-white bg-gradient-to-r from-indigo-600 to-violet-600 hover:from-indigo-700 hover:to-violet-700 focus:outline-none transition-all font-bold transform hover:-translate-y-0.5 text-lg">
                        Acessar Painel
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script src="js/login.js"></script>
</body>
</html>
