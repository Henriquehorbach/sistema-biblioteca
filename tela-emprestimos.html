<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Empréstimos - Biblioteca Inteligente</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .piscar-foco:focus {
            animation: pulse-border 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
        @keyframes pulse-border {
            0%, 100% { box-shadow: 0 0 0 0 rgba(99, 102, 241, 0.7); }
            50% { box-shadow: 0 0 0 8px rgba(99, 102, 241, 0); }
        }
        /* Nova classe apenas para a animação das abas */
        .transicao-suave { transition: all 0.4s ease-in-out; }
    </style>
</head>
<body class="bg-gradient-to-br from-blue-50 via-indigo-50 to-purple-100 min-h-screen p-4 md:p-8 relative">

    <!-- Header Simples (Intacto) -->
    <header class="w-full max-w-6xl mx-auto mt-2 md:mt-4 mb-8 flex flex-col md:flex-row justify-between items-center bg-white/80 backdrop-blur-md p-4 md:px-6 md:py-4 rounded-3xl shadow-sm border border-white/50">
        <div class="flex items-center mb-4 md:mb-0 px-2">
            <img src="Imagem/Logo app.png" alt="Logo" class="h-20 w-auto object-contain mr-4 drop-shadow-sm" onerror="this.style.display='none'">
            <div>
                <h1 class="text-2xl font-extrabold text-slate-800 tracking-tight">Balcão de Atendimento</h1>
                <p class="text-xs font-bold text-indigo-500 uppercase tracking-wider">Empréstimos e Devoluções</p>
            </div>
        </div>
        <div>
            <a href="acervo.html" class="text-slate-500 hover:text-indigo-600 font-bold px-4 py-2 transition-colors flex items-center">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" class="w-5 h-5 mr-2"><path stroke-linecap="round" stroke-linejoin="round" d="M9 15L3 9m0 0l6-6M3 9h12a6 6 0 010 12h-3" /></svg>
                Voltar
            </a>
        </div>
    </header>

    <!-- Área de Operação com as Novas Abas -->
    <main class="w-full max-w-6xl mx-auto">
        
        <!-- Sistema de Abas (Adicionado) -->
        <div class="flex space-x-2 px-4 md:px-8 mb-[-2px] relative z-10">
            <button onclick="mudarAba('emprestimo')" id="aba_emprestimo" class="px-8 py-4 bg-white/80 backdrop-blur-xl text-indigo-700 font-bold rounded-t-3xl border-t-4 border-indigo-500 shadow-[0_-4px_10px_rgb(0,0,0,0.02)] transition-all flex items-center">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" class="w-5 h-5 mr-2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 6.042A8.967 8.967 0 006 3.75c-1.052 0-2.062.18-3 .512v14.25A8.987 8.987 0 016 18c2.305 0 4.408.867 6 2.292m0-14.25a8.966 8.966 0 016-2.292c1.052 0 2.062.18 3 .512v14.25A8.987 8.987 0 0018 18a8.967 8.967 0 00-6 2.292m0-14.25v14.25" /></svg>
                Realizar Empréstimo
            </button>
            <button onclick="mudarAba('devolucao')" id="aba_devolucao" class="px-8 py-4 bg-white/40 text-slate-500 hover:bg-white/60 hover:text-slate-700 font-bold rounded-t-3xl border-t-4 border-transparent transition-all flex items-center">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" class="w-5 h-5 mr-2"><path stroke-linecap="round" stroke-linejoin="round" d="M9 15L3 9m0 0l6-6M3 9h12a6 6 0 010 12h-3" /></svg>
                Receber Devolução
            </button>
        </div>

        <!-- Grid Principal (Agora encapsulado para as abas funcionarem) -->
        <div id="grid_principal" class="bg-white/80 backdrop-blur-xl rounded-[2.5rem] rounded-tl-none shadow-[0_4px_20px_rgb(0,0,0,0.03)] border border-white/60 p-8 grid grid-cols-1 md:grid-cols-2 gap-8 transicao-suave relative z-0">
            
            <!-- Coluna 1: Leitura do Aluno -->
            <div id="coluna_aluno" class="flex flex-col transicao-suave">
                <div class="flex items-center mb-6">
                    <div class="bg-indigo-100 text-indigo-600 p-3 rounded-2xl mr-4">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-8 h-8"><path stroke-linecap="round" stroke-linejoin="round" d="M15 9h3.75M15 12h3.75M15 15h3.75M4.5 19.5h15a2.25 2.25 0 002.25-2.25V6.75A2.25 2.25 0 0019.5 4.5h-15a2.25 2.25 0 00-2.25 2.25v10.5A2.25 2.25 0 004.5 19.5zm6-10.125a1.875 1.875 0 11-3.75 0 1.875 1.875 0 013.75 0zm1.294 6.336a6.721 6.721 0 01-3.17.789 6.721 6.721 0 01-3.168-.789 3.376 3.376 0 016.338 0z" /></svg>
                    </div>
                    <div>
                        <h2 class="text-xl font-bold text-slate-800">Passo 1: Identificar Aluno</h2>
                        <p class="text-sm text-slate-500">Digite o Identificador/RA do aluno.</p>
                    </div>
                </div>
                
                <div class="flex gap-3 mb-6">
                    <input type="text" id="ra_aluno" placeholder="Ex: 2024001" autofocus class="piscar-foco w-full bg-white border-2 border-indigo-200 text-slate-800 text-lg rounded-2xl px-6 py-4 focus:outline-none focus:border-indigo-500 transition-all font-bold text-center shadow-inner">
                    <button type="button" onclick="buscarAluno()" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold px-6 rounded-2xl transition-colors shadow-lg shadow-indigo-500/30">
                        Buscar
                    </button>
                </div>
                
                <!-- Card de Confirmação do Aluno -->
                <div id="card_aluno" class="hidden bg-slate-50 border border-slate-200 rounded-2xl p-6 flex-1">
                    <div class="flex items-center justify-between mb-4 border-b border-slate-200 pb-4">
                        <div>
                            <p class="text-[11px] font-black text-slate-400 uppercase tracking-wider">Aluno Localizado</p>
                            <p class="text-lg font-extrabold text-slate-800" id="display_nome">Lucas Gabriel da Silva</p>
                        </div>
                        <span class="bg-emerald-100 text-emerald-700 text-xs font-bold px-3 py-1 rounded-full">🟢 Ativo</span>
                    </div>
                    <div class="grid grid-cols-2 gap-4 text-sm">
                        <div>
                            <p class="text-slate-400 font-bold">Turma/Ano</p>
                            <p class="text-slate-700 font-semibold">8º Ano B</p>
                        </div>
                        <div>
                            <p class="text-slate-400 font-bold">Identificador</p>
                            <p class="text-slate-700 font-semibold" id="display_ra">2024001</p>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Coluna 2: Leitura do Livro -->
            <div id="coluna_livro" class="flex flex-col opacity-50 pointer-events-none transicao-suave border-l border-slate-100 md:pl-8">
                <div class="flex items-center mb-6">
                    <div id="icone_livro_bg" class="bg-purple-100 text-purple-600 p-3 rounded-2xl mr-4 transition-colors">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-8 h-8"><path stroke-linecap="round" stroke-linejoin="round" d="M12 6.042A8.967 8.967 0 006 3.75c-1.052 0-2.062.18-3 .512v14.25A8.987 8.987 0 016 18c2.305 0 4.408.867 6 2.292m0-14.25a8.966 8.966 0 016-2.292c1.052 0 2.062.18 3 .512v14.25A8.987 8.987 0 0018 18a8.967 8.967 0 00-6 2.292m0-14.25v14.25" /></svg>
                    </div>
                    <div>
                        <h2 id="titulo_livro" class="text-xl font-bold text-slate-800">Passo 2: Registrar Livro</h2>
                        <p class="text-sm text-slate-500">Leia o código de barras do acervo.</p>
                    </div>
                </div>

                <input type="text" id="codigo_livro" placeholder="Bipe o código do livro..." class="piscar-foco w-full bg-white border-2 border-purple-200 text-slate-800 text-lg rounded-2xl px-6 py-5 focus:outline-none focus:border-purple-500 transition-all font-bold text-center mb-6 shadow-inner">
                
                <button type="button" id="btn_finalizar" onclick="finalizarAcao()" class="mt-auto w-full px-8 py-5 bg-gradient-to-r from-emerald-500 to-teal-500 text-white font-extrabold text-lg rounded-2xl shadow-lg shadow-emerald-500/30 hover:shadow-emerald-500/50 transform hover:-translate-y-1 transition-all text-center flex items-center justify-center">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="3" stroke="currentColor" class="w-6 h-6 mr-2"><path stroke-linecap="round" stroke-linejoin="round" d="M4.5 12.75l6 6 9-13.5" /></svg>
                    Confirmar Empréstimo
                </button>
            </div>
        </div>
    </main>

    <!-- Modal de Alerta Customizado Inteligente (Intacto) -->
    <div id="modal_alerta" class="fixed inset-0 z-50 flex items-center justify-center opacity-0 pointer-events-none transition-opacity duration-300">
        <div class="absolute inset-0 bg-slate-900/40 backdrop-blur-sm" onclick="fecharModal()"></div>
        <div id="modal_conteudo" class="relative bg-white/90 backdrop-blur-xl rounded-[2.5rem] p-8 max-w-sm w-full mx-4 shadow-2xl transform scale-95 transition-all duration-300 border border-white">
            <div class="text-center">
                <div id="modal_icone" class="mx-auto flex items-center justify-center h-20 w-20 rounded-full mb-6"></div>
                <h3 id="modal_titulo" class="text-2xl font-extrabold text-slate-800 mb-2 tracking-tight"></h3>
                <p id="modal_mensagem" class="text-slate-500 mb-8 font-medium"></p>
                <div id="modal_botoes" class="flex flex-col gap-3">
                    <button id="btn_modal_primario" class="w-full bg-slate-800 hover:bg-slate-900 text-white font-bold py-4 px-6 rounded-2xl transition-colors shadow-lg shadow-slate-500/30">Entendi</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const inputRa = document.getElementById('ra_aluno');
        const inputLivro = document.getElementById('codigo_livro');
        const cardAluno = document.getElementById('card_aluno');
        const colunaLivro = document.getElementById('coluna_livro');
        const colunaAluno = document.getElementById('coluna_aluno');
        const displayRa = document.getElementById('display_ra');
        const gridPrincipal = document.getElementById('grid_principal');
        const tituloLivro = document.getElementById('titulo_livro');
        const iconeLivroBg = document.getElementById('icone_livro_bg');
        const btnFinalizar = document.getElementById('btn_finalizar');

        let modoAtual = 'emprestimo'; // Variável para rastrear a aba

        // NOVA FUNÇÃO: Trocar Abas
        function mudarAba(modo) {
            modoAtual = modo;
            const abaEmp = document.getElementById('aba_emprestimo');
            const abaDev = document.getElementById('aba_devolucao');
            
            // Reseta a tela
            inputRa.disabled = false;
            inputRa.value = '';
            inputRa.classList.replace('border-emerald-500', 'border-indigo-200');
            inputLivro.value = '';
            cardAluno.classList.add('hidden');

            if (modo === 'emprestimo') {
                // Visual Aba
                abaEmp.className = "px-8 py-4 bg-white/80 backdrop-blur-xl text-indigo-700 font-bold rounded-t-3xl border-t-4 border-indigo-500 shadow-[0_-4px_10px_rgb(0,0,0,0.02)] transition-all flex items-center";
                abaDev.className = "px-8 py-4 bg-white/40 text-slate-500 hover:bg-white/60 hover:text-slate-700 font-bold rounded-t-3xl border-t-4 border-transparent transition-all flex items-center";
                
                // Exibe as duas colunas
                gridPrincipal.classList.replace('md:grid-cols-1', 'md:grid-cols-2');
                gridPrincipal.classList.remove('max-w-3xl', 'mx-auto');
                colunaAluno.classList.remove('hidden');
                colunaLivro.classList.add('md:pl-8', 'border-l');
                colunaLivro.classList.add('opacity-50', 'pointer-events-none'); // Bloqueia livro
                
                // Volta as cores do livro
                tituloLivro.innerText = "Passo 2: Registrar Livro";
                iconeLivroBg.className = "bg-purple-100 text-purple-600 p-3 rounded-2xl mr-4 transition-colors";
                inputLivro.className = "piscar-foco w-full bg-white border-2 border-purple-200 text-slate-800 text-lg rounded-2xl px-6 py-5 focus:outline-none focus:border-purple-500 transition-all font-bold text-center mb-6 shadow-inner";
                btnFinalizar.className = "mt-auto w-full px-8 py-5 bg-gradient-to-r from-emerald-500 to-teal-500 text-white font-extrabold text-lg rounded-2xl shadow-lg shadow-emerald-500/30 hover:shadow-emerald-500/50 transform hover:-translate-y-1 transition-all text-center flex items-center justify-center";
                btnFinalizar.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="3" stroke="currentColor" class="w-6 h-6 mr-2"><path stroke-linecap="round" stroke-linejoin="round" d="M4.5 12.75l6 6 9-13.5" /></svg> Confirmar Empréstimo`;
                
                inputRa.focus();
            } else {
                // Visual Aba
                abaDev.className = "px-8 py-4 bg-white/80 backdrop-blur-xl text-amber-600 font-bold rounded-t-3xl border-t-4 border-amber-500 shadow-[0_-4px_10px_rgb(0,0,0,0.02)] transition-all flex items-center";
                abaEmp.className = "px-8 py-4 bg-white/40 text-slate-500 hover:bg-white/60 hover:text-slate-700 font-bold rounded-t-3xl border-t-4 border-transparent transition-all flex items-center";
                
                // Esconde aluno, centraliza livro
                gridPrincipal.classList.replace('md:grid-cols-2', 'md:grid-cols-1');
                gridPrincipal.classList.add('max-w-3xl', 'mx-auto');
                colunaAluno.classList.add('hidden');
                colunaLivro.classList.remove('md:pl-8', 'border-l');
                colunaLivro.classList.remove('opacity-50', 'pointer-events-none'); // Libera livro
                
                // Cores Laranja para devolução
                tituloLivro.innerText = "Bipar Livro Devolvido";
                iconeLivroBg.className = "bg-amber-100 text-amber-600 p-3 rounded-2xl mr-4 transition-colors";
                inputLivro.className = "piscar-foco w-full bg-white border-2 border-amber-200 text-slate-800 text-lg rounded-2xl px-6 py-5 focus:outline-none focus:border-amber-500 transition-all font-bold text-center mb-6 shadow-inner";
                btnFinalizar.className = "mt-auto w-full px-8 py-5 bg-gradient-to-r from-amber-500 to-orange-500 text-white font-extrabold text-lg rounded-2xl shadow-lg shadow-amber-500/30 hover:shadow-amber-500/50 transform hover:-translate-y-1 transition-all text-center flex items-center justify-center";
                btnFinalizar.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="3" stroke="currentColor" class="w-6 h-6 mr-2"><path stroke-linecap="round" stroke-linejoin="round" d="M9 15L3 9m0 0l6-6M3 9h12a6 6 0 010 12h-3" /></svg> Confirmar Devolução`;
                
                inputLivro.focus();
            }
        }

        // Função do Modal Customizado e Inteligente (Seu código original mantido intacto)
        function mostrarAlerta(tipo, titulo, mensagem, textoBotao = 'Entendi', linkRedirecionamento = null) {
            const modal = document.getElementById('modal_alerta');
            const conteudo = document.getElementById('modal_conteudo');
            const icone = document.getElementById('modal_icone');
            const btnPrimario = document.getElementById('btn_modal_primario');
            const containerBotoes = document.getElementById('modal_botoes');
            
            document.getElementById('modal_titulo').innerText = titulo;
            document.getElementById('modal_mensagem').innerText = mensagem;

            if(tipo === 'erro') {
                icone.className = 'mx-auto flex items-center justify-center h-20 w-20 rounded-full bg-rose-100 text-rose-500 mb-6';
                icone.innerHTML = `<svg class="w-10 h-10" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" /></svg>`;
                btnPrimario.className = 'w-full bg-rose-600 hover:bg-rose-700 text-white font-bold py-4 px-6 rounded-2xl transition-colors shadow-lg shadow-rose-500/30';
            } else {
                icone.className = 'mx-auto flex items-center justify-center h-20 w-20 rounded-full bg-emerald-100 text-emerald-500 mb-6';
                icone.innerHTML = `<svg class="w-10 h-10" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" /></svg>`;
                btnPrimario.className = 'w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-4 px-6 rounded-2xl transition-colors shadow-lg shadow-emerald-500/30';
            }

            btnPrimario.innerText = textoBotao;
            containerBotoes.innerHTML = '';
            containerBotoes.appendChild(btnPrimario);

            if (linkRedirecionamento) {
                btnPrimario.onclick = () => window.location.href = linkRedirecionamento;
                const btnSecundario = document.createElement('button');
                btnSecundario.innerText = 'Cancelar e tentar novamente';
                btnSecundario.className = 'w-full text-slate-500 hover:text-slate-800 font-bold py-3 transition-colors';
                btnSecundario.onclick = fecharModal;
                containerBotoes.appendChild(btnSecundario);
            } else {
                btnPrimario.onclick = fecharModal;
            }

            modal.classList.remove('opacity-0', 'pointer-events-none');
            conteudo.classList.remove('scale-95');
            conteudo.classList.add('scale-100');
        }

        // Foco ajustado dependendo da aba
        function fecharModal() {
            const modal = document.getElementById('modal_alerta');
            const conteudo = document.getElementById('modal_conteudo');
            modal.classList.add('opacity-0', 'pointer-events-none');
            conteudo.classList.remove('scale-100');
            conteudo.classList.add('scale-95');
            
            if(modoAtual === 'emprestimo') {
                if(inputRa.disabled === false) inputRa.focus();
                else inputLivro.focus();
            } else {
                inputLivro.focus();
            }
        }

        function buscarAluno() {
            const valor = inputRa.value.trim();
            if (valor === '') {
                mostrarAlerta('erro', 'Campo Vazio!', 'Por favor, digite o identificador do aluno antes de buscar.');
                return;
            }
            if (valor === '999') {
                mostrarAlerta('erro', 'Aluno não encontrado!', 'Nenhum leitor cadastrado com esse identificador. Deseja realizar o cadastro agora?', 'Ir para Cadastro de Alunos', 'cadastro-leitores.html');
                inputRa.value = '';
                return;
            }
            cardAluno.classList.remove('hidden');
            displayRa.innerText = valor;
            inputRa.disabled = true;
            inputRa.classList.replace('border-indigo-200', 'border-emerald-500');
            colunaLivro.classList.remove('opacity-50', 'pointer-events-none');
            inputLivro.focus(); 
        }

        inputRa.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') buscarAluno();
        });

        // Função de finalizar unificada (Empréstimo ou Devolução)
        function finalizarAcao() {
            const valorLivro = inputLivro.value.trim();

            if (valorLivro === '') {
                mostrarAlerta('erro', 'Campo Vazio!', 'Por favor, bipe o código do livro para finalizar a operação.');
                return;
            }

            if (valorLivro === '999') {
                mostrarAlerta('erro', 'Livro não encontrado!', 'O código lido não consta no acervo. Deseja cadastrar esta obra agora?', 'Ir para Cadastro de Livros', 'cadastro-livros.html');
                inputLivro.value = '';
                return;
            }

            // Exibe mensagem de acordo com o modo
            if(modoAtual === 'emprestimo') {
                mostrarAlerta('sucesso', 'Empréstimo Concluído!', 'O livro foi vinculado ao aluno com sucesso no sistema. Já pode entregar a obra!');
                inputRa.disabled = false;
                inputRa.value = '';
                inputRa.classList.replace('border-emerald-500', 'border-indigo-200');
                inputLivro.value = '';
                cardAluno.classList.add('hidden');
                colunaLivro.classList.add('opacity-50', 'pointer-events-none');
            } else {
                mostrarAlerta('sucesso', 'Devolução Concluída!', 'O livro retornou ao acervo e a pendência do aluno foi removida com sucesso!');
                inputLivro.value = '';
            }
        }
    </script>
</body>
</html>
